<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تحدي السرعة - لعبة تفاعلية</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
        }
        body {
            background: #090d16;
            color: #ffffff;
            font-family: Tahoma, sans-serif;
            text-align: center;
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }
        .game-container {
            width: 100%;
            max-width: 380px;
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
        }
        h1 {
            color: #38bdf8;
            margin: 0 0 15px 0;
            font-size: 22px;
            text-shadow: 0 0 10px rgba(56, 189, 248, 0.4);
        }
        .stats-box {
            display: flex;
            justify-content: space-around;
            background: rgba(15, 23, 42, 0.6);
            border-radius: 12px;
            padding: 10px;
            margin-bottom: 20px;
            font-size: 15px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .stat-item span {
            color: #38bdf8;
            font-weight: bold;
        }
        #game-area {
            width: 100%;
            height: 320px;
            background: #0f172a;
            border-radius: 16px;
            position: relative;
            overflow: hidden;
            border: 2px dashed rgba(56, 189, 248, 0.3);
        }
        #target {
            width: 65px;
            height: 65px;
            background: linear-gradient(135deg, #f43f5e, #fb7185);
            border-radius: 50%;
            position: absolute;
            cursor: pointer;
            display: none;
            box-shadow: 0 0 20px #f43f5e;
            transition: transform 0.08s ease;
        }
        #target:active {
            transform: scale(0.8);
        }
        .btn {
            background: linear-gradient(135deg, #38bdf8, #0284c7);
            color: #0f172a;
            border: none;
            width: 100%;
            padding: 14px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 14px;
            cursor: pointer;
            margin-top: 20px;
            box-shadow: 0 8px 20px rgba(56, 189, 248, 0.3);
            transition: 0.2s;
        }
        .btn:active {
            transform: scale(0.97);
        }
    </style>
</head>
<body>

    <div class="game-container">
        <h1>⚡ تحدي السرعة</h1>
        
        <div class="stats-box">
            <div class="stat-item">النقاط: <span id="score">0</span></div>
            <div class="stat-item">الوقت: <span id="timer">10</span> ث</div>
        </div>

        <div id="game-area">
            <div id="target" onclick="hitTarget()"></div>
        </div>

        <button class="btn" id="start-btn" onclick="startGame()">ابدأ التحدي</button>
    </div>

    <script>
        let score = 0;
        let timeLeft = 10;
        let gameInterval;
        let timerInterval;
        let isPlaying = false;

        const target = document.getElementById('target');
        const scoreDisplay = document.getElementById('score');
        const timerDisplay = document.getElementById('timer');
        const startBtn = document.getElementById('start-btn');
        const gameArea = document.getElementById('game-area');

        function startGame() {
            score = 0;
            timeLeft = 10;
            scoreDisplay.textContent = score;
            timerDisplay.textContent = timeLeft;
            startBtn.style.display = 'none';
            target.style.display = 'block';
            isPlaying = true;

            moveTarget();

            timerInterval = setInterval(() => {
                timeLeft--;
                timerDisplay.textContent = timeLeft;
                if (timeLeft <= 0) {
                    endGame();
                }
            }, 1000);

            gameInterval = setInterval(moveTarget, 750);
        }

        function moveTarget() {
            if (!isPlaying) return;
            const maxX = gameArea.clientWidth - target.clientWidth;
            const maxY = gameArea.clientHeight - target.clientHeight;
            const randomX = Math.floor(Math.random() * maxX);
            const randomY = Math.floor(Math.random() * maxY);
            target.style.left = randomX + 'px';
            target.style.top = randomY + 'px';
        }

        function hitTarget() {
            if (!isPlaying) return;
            score++;
            scoreDisplay.textContent = score;
            moveTarget();
        }

        function endGame() {
            isPlaying = false;
            clearInterval(gameInterval);
            clearInterval(timerInterval);
            target.style.display = 'none';
            startBtn.style.display = 'block';
            startBtn.textContent = 'العب مجدداً (نتيجتك: ' + score + ')';
        }
    </script>
</body>
</html>
