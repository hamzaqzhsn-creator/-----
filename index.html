<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تحدي النقاط - لعبة تفاعلية</title>
    <style>
        body {
            background: linear-gradient(135deg, #0f172a, #1e293b);
            color: #ffffff;
            font-family: Tahoma, sans-serif;
            text-align: center;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }
        h1 {
            color: #38bdf8;
            margin-bottom: 5px;
            font-size: 24px;
        }
        .stats {
            font-size: 18px;
            margin-bottom: 20px;
            color: #cbd5e1;
        }
        #game-area {
            width: 100%;
            max-width: 350px;
            height: 350px;
            background-color: #334155;
            border-radius: 15px;
            position: relative;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            overflow: hidden;
            border: 2px solid #475569;
        }
        #target {
            width: 70px;
            height: 70px;
            background: linear-gradient(135deg, #f43f5e, #fb7185);
            border-radius: 50%;
            position: absolute;
            cursor: pointer;
            display: none;
            box-shadow: 0 5px 15px rgba(244, 63, 94, 0.4);
            transition: transform 0.1s;
        }
        #target:active {
            transform: scale(0.9);
        }
        .btn {
            background-color: #38bdf8;
            color: #0f172a;
            border: none;
            padding: 12px 25px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 20px;
            box-shadow: 0 4px 10px rgba(56, 189, 248, 0.3);
        }
        .btn:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>

    <h1>🎮 تحدي السرعة</h1>
    <div class="stats">
        النقاط: <span id="score">0</span> | الوقت: <span id="timer">10</span>ث
    </div>

    <div id="game-area">
        <div id="target" onclick="hitTarget()"></div>
    </div>

    <button class="btn" id="start-btn" onclick="startGame()">ابدأ اللعبة</button>

    <script>
        let score = 0;
        let timeLeft = 10;
        let gameInterval;
        let timerInterval;
        let isPlaying = false;

        const target = document.getElementById('target');
        const scoreDisplay = document.getElementById('score');
        const timerDisplay = document.getElementById('timer');
        const startBtn = document.getElementById('start-btn');
        const gameArea = document.getElementById('game-area');

        function startGame() {
            score = 0;
            timeLeft = 10;
            scoreDisplay.textContent = score;
            timerDisplay.textContent = timeLeft;
            startBtn.style.display = 'none';
            target.style.display = 'block';
            isPlaying = true;

            moveTarget();

            timerInterval = setInterval(() => {
                timeLeft--;
                timerDisplay.textContent = timeLeft;
                if (timeLeft <= 0) {
                    endGame();
                }
            }, 1000);

            gameInterval = setInterval(moveTarget, 800); // يغير مكانه كل 0.8 ثانية
        }

        function moveTarget() {
            if (!isPlaying) return;
            const maxX = gameArea.clientWidth - target.clientWidth;
            const maxY = gameArea.clientHeight - target.clientHeight;
            const randomX = Math.floor(Math.random() * maxX);
            const randomY = Math.floor(Math.random() * maxY);
            target.style.left = randomX + 'px';
            target.style.top = randomY + 'px';
        }

        function hitTarget() {
            if (!isPlaying) return;
            score++;
            scoreDisplay.textContent = score;
            moveTarget();
        }

        function endGame() {
            isPlaying = false;
            clearInterval(gameInterval);
            clearInterval(timerInterval);
            target.style.display = 'none';
            startBtn.style.display = 'block';
            startBtn.textContent = 'العب مرة أخرى (النتيجة: ' + score + ')';
        }
    </script>
</body>
</html>
